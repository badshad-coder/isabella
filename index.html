<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Изабелла</title>
<style>
:root{--bg:#f4f4f0;--fg:#1c1c1a;--board:#e4e6df;--snake:#2f8f4e;--head:#1d6b37;--food:#d6402f;--muted:#b8b8b0;--text:#6b6b66;--onsnake:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161816;--fg:#ececE6;--board:#222622;--snake:#4cc27a;--head:#7be0a1;--food:#ff6b57;--muted:#3b3f3b;--text:#9a9a94;--onsnake:#10200f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161816;--fg:#ececE6;--board:#222622;--snake:#4cc27a;--head:#7be0a1;--food:#ff6b57;--muted:#3b3f3b;--text:#9a9a94;--onsnake:#10200f;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#name{display:flex;gap:4px;font-size:clamp(1.6rem,8vw,2.6rem);font-weight:700;letter-spacing:.04em}
#name{min-height:1.3em}
#name span{color:var(--snake);opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s}
#name span.on{opacity:1;transform:scale(1.1)}
#love{font-size:clamp(1.1rem,5vw,1.6rem);font-weight:600;color:var(--food);opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s;min-height:1.3em}
#love.on{opacity:1;transform:none}
#info{display:flex;gap:24px;font-size:1rem}
canvas{width:min(92vw,480px);height:auto;aspect-ratio:1;background:var(--board);border-radius:10px;touch-action:none}
p{margin:0;color:var(--text);font-size:.9rem;text-align:center}
button{font:inherit;padding:8px 18px;border-radius:8px;border:1px solid var(--text);background:transparent;color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<div id="name"></div>
<div id="love">Изабелла + Роберт = ❤️</div>
<div id="info"><span>Буквы: <b id="score">0</b></span><span>Рекорд: <b id="best">0</b></span></div>
<canvas id="c" width="480" height="480"></canvas>
<p id="msg">Нажми любую стрелку, чтобы начать</p>
<button id="restart">Заново</button>
<script>
const NAME='ИЗАБЕЛЛА',N=20,S=480/N,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const sc=document.getElementById('score'),bs=document.getElementById('best'),msg=document.getElementById('msg'),nm=document.getElementById('name');
nm.innerHTML=[...NAME].map(l=>`<span>${l}</span>`).join('');
const spans=[...nm.children],love=document.getElementById('love');
let best=0;try{best=+localStorage.getItem('isabella-best')||0}catch(e){}
bs.textContent=best;
let snake,dir,next,food,score,timer,running,started,won;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function reset(){
  clearInterval(timer);
  snake=[{x:10,y:10}];dir=null;next=null;score=0;running=false;started=false;won=false;
  sc.textContent=0;msg.textContent='Нажми любую стрелку, чтобы начать';
  love.classList.remove('on');updateName();placeFood();draw();
}
function updateName(){spans.forEach((s,i)=>s.classList.toggle('on',i<snake.length-1))}
function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function start(){started=true;running=true;msg.textContent='Лови красные точки, и появится имя';timer=setInterval(tick,120)}
function tick(){
  if(next)dir=next;
  if(!dir)return;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))return over();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;sc.textContent=score;
    if(score>best){best=score;bs.textContent=best;try{localStorage.setItem('isabella-best',best)}catch(e){}}
    updateName();
    if(snake.length-1>=NAME.length){won=true;love.classList.add('on');msg.textContent='Победа! Имя «Изабелла» собрано 💖 Нажми «Заново» или Пробел';clearInterval(timer);running=false;draw();return}
    placeFood();
  }else snake.pop();
  draw();
}
function over(){clearInterval(timer);running=false;msg.textContent='Игра окончена. Нажми «Заново» или Пробел';draw()}
function draw(){
  ctx.clearRect(0,0,480,480);
  ctx.fillStyle=css('--food');ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);ctx.fill();
  ctx.font=`700 ${Math.round(S*.68)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  snake.forEach((s,i)=>{
    ctx.fillStyle=css(i?'--snake':'--head');ctx.beginPath();ctx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,6);ctx.fill();
    if(i>0){ctx.fillStyle=css('--onsnake');ctx.fillText(NAME[(i-1)%NAME.length],s.x*S+S/2,s.y*S+S/2+1)}
  });
}
function turn(d){
  if(!started&&!running)start();
  if(!running)return;
  const cur=next||dir;
  if(cur&&cur.x===-d.x&&cur.y===-d.y)return;
  next=d;
}
const keys={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
document.addEventListener('keydown',e=>{
  if(keys[e.key]){e.preventDefault();turn(keys[e.key])}
  else if(e.key===' '){e.preventDefault();reset()}
});
document.getElementById('restart').onclick=reset;
let t0;
cv.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?keys.ArrowRight:keys.ArrowLeft):(dy>0?keys.ArrowDown:keys.ArrowUp));
});
reset();
</script>
</body>
</html>
